version: "3.9"

services:
  bot:
    build: .
    container_name: chitobrito-bot
    env_file: .env
    volumes:
      - ./secrets/chito-brito-03eec1a62a59.json:/app/secrets/chito-brito-03eec1a62a59.json:ro
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chitobrito-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
